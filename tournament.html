<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tournament</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.8/dist/sweetalert2.all.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#059669;--accent:#10b981;--bg:#f7fdfa;--card:#ffffff;--text:#10201a;--mut:color-mix(in srgb,var(--text) 55%,transparent);--line:#d8ece2;--soft:color-mix(in srgb,var(--accent) 12%,#fff)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Outfit','Noto Serif Bengali',system-ui,sans-serif;color:var(--text);min-height:100vh;padding-bottom:96px;user-select:none;
 background:radial-gradient(120% 55% at 50% 0%,color-mix(in srgb,var(--accent) 22%,#fff) 0%,color-mix(in srgb,var(--accent) 7%,#fff) 48%,var(--bg) 100%) fixed}
button,input,select{font:inherit}
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid color-mix(in srgb,var(--accent) 18%,#fff);box-shadow:0 2px 10px rgba(16,32,26,.04);padding:12px 16px;display:flex;align-items:center;gap:12px}
.top h1{font-size:19px;margin:0;flex:1;font-weight:800;letter-spacing:.2px}
#back{width:36px;height:36px;border-radius:14px;background:var(--soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:.2s}#back:active{transform:scale(.9)}
.bal{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 55%,#fff),var(--accent) 55%,var(--primary));color:#fff;border-radius:99px;padding:7px 14px;font-weight:800;font-size:14px;box-shadow:0 8px 18px color-mix(in srgb,var(--primary) 30%,transparent)}
.pad{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.view{animation:fadeUp .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.stg>*{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both}.stg>*:nth-child(2){animation-delay:.05s}.stg>*:nth-child(3){animation-delay:.1s}.stg>*:nth-child(4){animation-delay:.15s}.stg>*:nth-child(5){animation-delay:.2s}.stg>*:nth-child(n+6){animation-delay:.25s}
.sq{background:rgba(255,255,255,.85);border:1.5px solid var(--line);border-radius:24px;overflow:hidden;cursor:pointer;aspect-ratio:1/1;display:flex;flex-direction:column;box-shadow:0 12px 32px color-mix(in srgb,var(--accent) 12%,transparent),0 2px 6px rgba(16,32,26,.04);transition:transform .25s cubic-bezier(.4,0,.2,1),box-shadow .25s,border-color .25s}
.sq:hover{border-color:var(--accent);transform:translateY(-3px)}.sq:active{transform:scale(.96)}
.sq .im{flex:1;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 35%,#fff),var(--soft)) center/cover no-repeat;transition:transform .5s}.sq:hover .im{transform:scale(1.04)}
.sq .tx{padding:10px;text-align:center;background:#fff;position:relative}.sq b{display:block;font-size:14px;font-weight:800}.sq small{color:var(--mut);font-size:11px}
.card{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);border-radius:24px;box-shadow:0 12px 32px color-mix(in srgb,var(--accent) 10%,transparent),0 2px 6px rgba(16,32,26,.03);padding:16px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;gap:8px;margin:6px 0;align-items:center}.k{color:var(--mut);font-size:10.5px;text-transform:uppercase;font-weight:700;letter-spacing:.04em}.v{font-weight:800}
.btn{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 60%,#fff),var(--accent) 55%,var(--primary));color:#fff;border:0;border-radius:16px;padding:11px 18px;font-weight:800;cursor:pointer;box-shadow:0 10px 22px color-mix(in srgb,var(--primary) 30%,transparent);transition:transform .2s,box-shadow .2s}
.btn:hover{box-shadow:0 12px 28px color-mix(in srgb,var(--primary) 40%,transparent)}.btn:active{transform:scale(.95)}
.btn.o{background:var(--soft);color:var(--primary);box-shadow:none;border:1.5px solid color-mix(in srgb,var(--accent) 35%,#fff)}.btn:disabled{opacity:.5;box-shadow:none}
.bar{height:9px;border-radius:9px;background:#e6f3ec;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--primary));border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.timer{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--primary));color:#fff;border-radius:16px;padding:10px;text-align:center;font-weight:800;margin-top:12px;letter-spacing:.3px}
.pl{font-size:12px;color:var(--mut);margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;word-break:break-word}
.pl span{display:inline-block;background:var(--soft);color:var(--primary);border-radius:10px;padding:3px 10px;margin:3px;font-weight:600}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid color-mix(in srgb,var(--accent) 15%,#fff);display:flex;padding:6px 8px max(8px,env(safe-area-inset-bottom));z-index:45}
.nav a{flex:1;text-align:center;font-size:11px;padding:6px 0;color:var(--mut);cursor:pointer;font-weight:700;border-radius:18px;transition:.25s;margin:0 2px}
.nav a.on{color:var(--primary);background:var(--soft)}.nav a em{display:block;font-style:normal;font-size:20px;transition:transform .25s}.nav a.on em{transform:translateY(-2px) scale(1.12)}.nav a:active{transform:scale(.92)}
.fab{position:fixed;right:16px;bottom:96px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--primary));display:flex;align-items:center;justify-content:center;font-size:22px;text-decoration:none;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 40%,transparent);z-index:46;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.li{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:700;transition:background .2s,padding .2s}.li:last-child{border:0}.li:hover{background:var(--soft);padding-left:12px;border-radius:14px}.li:active{transform:scale(.98)}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--primary)) center/cover;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;color:#fff;border:3px solid #fff;box-shadow:0 6px 14px rgba(16,32,26,.12)}
input.in,select.in{width:100%;padding:13px 15px;border-radius:16px;border:1.5px solid var(--line);background:rgba(255,255,255,.95);color:var(--text);font-weight:700;margin:5px 0;outline:none;transition:.2s}
input.in:focus,select.in:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent)}
.hide{display:none!important}.mut{color:var(--mut);font-size:12px}.pill{font-size:11px;border-radius:99px;padding:3px 10px;font-weight:800;color:#fff;background:var(--primary)}
.hero{border-radius:26px;padding:18px;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 60%,#fff),var(--accent) 50%,var(--primary));box-shadow:0 14px 30px color-mix(in srgb,var(--primary) 30%,transparent);margin-bottom:16px;position:relative;overflow:hidden}
.hero:after{content:'🏆';position:absolute;right:-6px;top:-14px;font-size:84px;opacity:.18}.hero b{font-size:18px;display:block}.hero span{font-size:12px;opacity:.92}
.swal2-popup{background:#fff!important;color:var(--text)!important;border-radius:26px!important;font-family:'Outfit','Noto Serif Bengali',sans-serif!important}.swal2-title,.swal2-html-container{color:var(--text)!important}
.swal2-confirm{background:linear-gradient(135deg,var(--accent),var(--primary))!important;border-radius:14px!important}
.msg{text-align:center;padding:60px 20px;color:var(--mut)}
</style>
</head><body>
<div class="top"><div id="back" class="hide" onclick="goHome()" style="font-size:22px;cursor:pointer">‹</div><h1 id="ttl">🏆 Tournament</h1><div class="bal">৳<span id="bal">0</span></div></div>
<div id="app"><div class="msg">Loading…</div></div>
<a id="fab" class="fab hide" target="_blank" rel="noopener">🎧</a>
<div class="nav" id="nav"><a data-t="home" class="on" onclick="tab('home')"><em>🏠</em>Home</a><a data-t="lb" onclick="tab('lb')"><em>🏅</em>Leaderboard</a><a data-t="ref" onclick="tab('ref')"><em>🎁</em>Refer</a><a data-t="me" onclick="tab('me')"><em>👤</em>Profile</a></div>
<script>
const BACKEND="https://9on3qmsyno.apps.bot-hosting.cloud";
firebase.initializeApp({apiKey:"AIzaSyAJWDIhsO4nAnBvpVZ0FP3kIlHFEU2Ysq4",authDomain:"m-h-x-wab-7abdf.firebaseapp.com",projectId:"m-h-x-wab-7abdf",appId:"1:570748526283:web:3c786486aa3f838188c54e"});
let me=null,P={},D={cats:[],matches:[]},CFG={},curCat=null,cur='home';
const $=id=>document.getElementById(id),esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ms=>new Date(ms).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:true});
async function api(p,b){const t=await me.getIdToken();const r=await fetch(BACKEND+p,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(b||{})});let j={};try{j=await r.json()}catch(e){}if(!r.ok||j.ok===false&&j.error)throw new Error(j.error||j.message||'Error '+r.status);return j}
const err=e=>Swal.fire('Oops',e.message||String(e),'error');
function theme(c){const s=document.documentElement.style;for(const k in c)s.setProperty('--'+k,c[k])}
async function boot(){
  try{const r=await fetch(BACKEND+'/tInfo');CFG=await r.json();theme(CFG.colors||{});
    if(CFG.hidden){$('app').innerHTML='<div class="msg">Tournament is currently unavailable.<br><br><a href="index.html" style="color:var(--accent)">← Back to main site</a></div>';$('nav').classList.add('hide');return}
    if(CFG.supportUrl){$('fab').href=CFG.supportUrl;$('fab').classList.remove('hide')}}catch(e){}
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){$('app').innerHTML='<div class="msg">Please log in on the main site first.<br><br><a class="btn" href="index.html" style="text-decoration:none;display:inline-block">Go to login</a></div>';$('nav').classList.add('hide');return}
    me=u;try{const q=new URLSearchParams(location.search);const j=await api('/tInit',{ref:q.get('ref')||localStorage.getItem('tref')||''});P=j.profile;CFG=Object.assign(CFG,j);
      if(P.banned){$('nav').classList.add('hide');$('app').innerHTML='<div class="pad view"><div class="card" style="text-align:center;padding:30px 18px"><div style="font-size:54px">🚫</div><div class="v" style="font-size:20px;margin:8px 0">আপনি ব্যান হয়েছেন</div><div class="mut" style="font-size:14px">কারণ:</div><div class="v" style="font-size:16px;margin:6px 0 16px;color:#dc2626">'+esc(P.banReason||'অজানা')+'</div><div class="mut">আপনার ID: '+esc(P.numId)+'</div><a class="btn" style="display:inline-block;text-decoration:none;margin-top:16px" href="'+esc(CFG.supportUrl||'#')+'" target="_blank">সাপোর্টে যোগাযোগ করুন</a></div></div>';return}
      if(q.get('payok')){try{const v=await api('/tDepositVerify',{ref:q.get('payok')});if(v.ok)Swal.fire('Added!','৳'+v.amount+' added to Tournament wallet','success')}catch(e){}history.replaceState({},'',location.pathname)}
      await loadHome();tab('home')}catch(e){$('app').innerHTML='<div class="msg">'+esc(e.message)+'</div>'}});
}
try{const q=new URLSearchParams(location.search).get('ref');if(q)localStorage.setItem('tref',q)}catch(e){}
async function loadHome(){D=await api('/tHome');$('bal').innerText=D.balance;P.balance=D.balance}
function setBack(on,t){$('back').classList.toggle('hide',!on);$('ttl').innerText=t||'🏆 Tournament'}
function goHome(){curCat=null;tab('home')}
function tab(t){cur=t;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.t===t));setBack(false);({home:viewHome,lb:viewLb,ref:viewRef,me:viewMe})[t]()}
async function viewHome(){
  if(curCat)return viewCat();
  await loadHome().catch(()=>{});
  $('app').innerHTML='<div class="pad view"><div class="hero"><b>Play. Win. Withdraw.</b><span>Pick a tournament below and join with your Tournament wallet</span></div><div class="grid stg">'+(D.cats.length?D.cats.map(c=>`<div class="sq" onclick="openCat('${esc(c.id)}')"><div class="im" style="${c.image?`background-image:url('${esc(c.image)}')`:''}"></div><div class="tx"><b>${esc(c.name)}</b><small>${esc(c.sub)}</small></div></div>`).join(''):'<div class="msg" style="grid-column:1/3">No tournaments yet</div>')+'</div></div>';
}
function openCat(id){curCat=id;viewCat()}
function viewCat(){
  const c=D.cats.find(x=>x.id===curCat)||{};setBack(true,c.name);
  const ms=D.matches.filter(m=>m.catId===curCat&&m.status==='open');
  $('app').innerHTML='<div class="pad view stg">'+(ms.map(matchCard).join('')||'<div class="msg">No matches right now</div>')+'</div>';tick();
}
function matchCard(m){const full=m.joined>=m.maxPlayers,pct=Math.round(m.joined/Math.max(1,m.maxPlayers)*100);
 return `<div class="card"><div class="row"><b style="font-size:16px">${esc(m.title)}</b></div><div class="mut">${fmt(m.startMs)}</div>
 <div class="row" style="margin-top:12px"><div><div class="k">Win prize</div><div class="v" style="color:var(--primary)">৳${m.prize}</div></div><div><div class="k">Entry fee</div><div class="v">৳${m.entryFee}</div></div><div><div class="k">Players</div><div class="v">${m.joined}/${m.maxPlayers}</div></div></div>
 <div class="bar"><i style="width:${pct}%"></i></div>
 <div class="row" style="margin-top:10px">${m.mine?`<button class="btn o" onclick="room('${m.id}')">🔑 Room Details</button><span class="pill">Joined ✓</span>`:`<span class="mut">${full?'Full':(m.maxPlayers-m.joined)+' spots left'}</span><button class="btn" ${full||m.startMs<=D.now?'disabled':''} onclick="join('${m.id}')">Join</button>`}</div>
 <div class="timer" data-s="${m.startMs}">–</div>
 <div class="pl"><b>Joined players (${m.joined}):</b><br>${m.players.length?m.players.map(n=>`<span>${esc(n)}</span>`).join(''):'<span>No one yet</span>'}</div></div>`}
let tk=null;function tick(){clearInterval(tk);const f=()=>{document.querySelectorAll('.timer').forEach(e=>{const d=+e.dataset.s-Date.now();if(d<=0){e.innerText='Started / Starting now';return}const h=Math.floor(d/36e5),mi=Math.floor(d%36e5/6e4),s=Math.floor(d%6e4/1e3);e.innerText='STARTS IN  '+String(h).padStart(2,'0')+'h:'+String(mi).padStart(2,'0')+'m:'+String(s).padStart(2,'0')+'s'})};f();tk=setInterval(f,1000)}
async function join(id){const m=D.matches.find(x=>x.id===id);
 const r=await Swal.fire({title:'Join: '+m.title,html:`<div class="mut" style="margin-bottom:6px">৳${m.entryFee} will be deducted from your Tournament wallet</div><input id="gn" class="in" placeholder="In-game ID name"><input id="gu" class="in" inputmode="numeric" placeholder="In-game UID"><select id="gr" class="in"><option>BD</option><option>IND</option><option>PK</option><option>SG</option><option>ID</option><option>TH</option><option>VN</option><option>BR</option><option>ME</option></select><div class="mut" style="margin-top:6px">আপনার আইডির লেভেল যাচাই করা হবে</div>`,showCancelButton:true,confirmButtonText:'Confirm',preConfirm:()=>{const a=$('gn').value.trim(),b=$('gu').value.trim();if(!a||!b){Swal.showValidationMessage('Name and UID required');return false}return{gameName:a,gameUid:b,region:$('gr').value}}});
 if(!r.isConfirmed)return;Swal.fire({title:'যাচাই করা হচ্ছে…',text:'আইডির লেভেল চেক হচ্ছে',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});try{const j=await api('/tJoin',Object.assign({matchId:id},r.value));$('bal').innerText=j.balance;await loadHome();viewCat();if(j.rejected)Swal.fire({icon:'warning',title:'লেভেল কম',html:'আপনার আইডির লেভেল <b>'+j.level+'</b>, মিনিমাম <b>'+j.need+'</b> লাগবে।<br>এন্ট্রি ফি ৳'+j.fee+' কাটা হয়েছে, কিন্তু আপনাকে ম্যাচে নেওয়া হয়নি। সাপোর্টে যোগাযোগ করুন।'});else Swal.fire('Joined!','Level '+j.level+' ✓ — Room details appear at start time.','success')}catch(e){Swal.close();err(e)}}
async function room(id){try{const j=await api('/tRoom',{matchId:id});if(!j.ready)return Swal.fire('Not yet','Room ID & password will appear at '+(j.revealMs?fmt(j.revealMs):'start time'),'info');
 Swal.fire({title:'Room Details',html:`<div class="k">Room ID</div><div class="v" style="font-size:20px">${esc(j.roomId)} <button class="btn o" onclick="cp('${esc(j.roomId)}')">Copy</button></div><br><div class="k">Password</div><div class="v" style="font-size:20px">${esc(j.roomPass||'–')} <button class="btn o" onclick="cp('${esc(j.roomPass)}')">Copy</button></div>`})}catch(e){err(e)}}
function cp(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>Swal.fire({toast:true,position:'top',title:'Copied',timer:1000,showConfirmButton:false})).catch(()=>prompt('Copy:',t))}
async function viewLb(){$('app').innerHTML='<div class="msg">Loading…</div>';try{const j=await api('/tLeaderboard');
 $('app').innerHTML='<div class="pad view stg"><div class="card"><b>🏅 Top winners</b><div class="mut">Day: '+esc(j.date)+' • updates once a day</div></div>'+(j.rows.map((r,i)=>`<div class="li"><div style="width:24px;font-weight:800;color:var(--primary)">${i+1}</div><div class="av" style="${r.photo?`background-image:url('${esc(r.photo)}')`:''}">${r.photo?'':esc(r.name[0]||'?')}</div><div style="flex:1">${esc(r.name)}<div class="mut">${r.wins} wins</div></div><div class="v" style="color:var(--accent)">৳${r.amount}</div></div>`).join('')||'<div class="msg">No winners yet</div>')+'</div>'}catch(e){$('app').innerHTML='<div class="msg">'+esc(e.message)+'</div>'}}
async function viewRef(){const r=await api('/tInit',{});P=r.profile;const link=location.origin+location.pathname+'?ref='+P.refCode;
 $('app').innerHTML=`<div class="pad view stg"><div class="card"><b>🎁 Refer & earn (Tournament wallet only)</b><p class="mut">You get ৳${CFG.refFixed!=null?'':''}a bonus per friend who joins and a commission on every deposit they make.</p><div class="k">Your code</div><div class="v" style="font-size:22px">${esc(P.refCode)}</div><div class="k" style="margin-top:10px">Your link</div><div class="mut" style="word-break:break-all">${esc(link)}</div><button class="btn" style="margin-top:10px;width:100%" onclick="cp('${esc(link)}')">Copy link</button></div><div class="grid"><div class="card"><div class="k">Referred</div><div class="v">${P.refCount}</div></div><div class="card"><div class="k">Earned</div><div class="v">৳${P.refEarned}</div></div></div></div>`}
function viewMe(){$('app').innerHTML=`<div class="pad view stg"><div class="card" style="text-align:center"><div class="av" style="width:76px;height:76px;margin:0 auto;font-size:28px;${P.photo?`background-image:url('${esc(P.photo)}')`:''}" onclick="$('pf').click()">${P.photo?'':esc((P.name||'?')[0])}</div><input type="file" id="pf" accept="image/*" class="hide" onchange="pic(this)"><div class="v" style="font-size:18px;margin-top:8px">${esc(P.name)}</div><div class="mut">Wins: ${P.wins}</div><div class="mut" style="margin-top:6px">User ID: <b>${esc(P.numId)}</b> <a onclick="cp('${esc(P.numId)}')" style="color:var(--primary);cursor:pointer">copy</a></div><div class="mut" style="margin-top:6px">Support PIN: <b>${esc(P.supportPin)}</b> <a onclick="cp('${esc(P.supportPin)}')" style="color:var(--primary);cursor:pointer">copy</a></div></div>
 <div class="card" style="padding:4px 14px"><div class="li" onclick="addMoney()">➕ Add Money</div><div class="li" onclick="withdraw()">💸 Withdraw</div><div class="li" onclick="wdHist()">🧾 Withdraw History</div><div class="li" onclick="rename()">✏️ Change name</div><div class="li" onclick="pass()">🔒 Change password</div><div class="li" onclick="location.href='index.html'">↩ Back to main website</div></div></div>`}
async function rename(){const r=await Swal.fire({title:'Your name',input:'text',inputValue:P.name,showCancelButton:true});if(!r.isConfirmed)return;try{const j=await api('/tProfile',{name:r.value});P=j.profile;viewMe()}catch(e){err(e)}}
function pic(inp){const f=inp.files[0];if(!f)return;const im=new Image();im.onload=async()=>{const c=document.createElement('canvas'),s=Math.min(1,160/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);try{const j=await api('/tProfile',{photo:c.toDataURL('image/jpeg',.7)});P=j.profile;viewMe()}catch(e){err(e)}};im.src=URL.createObjectURL(f)}
async function pass(){const r=await Swal.fire({title:'Change password',html:'<input id="p0" type="password" class="in" placeholder="Old password"><input id="p1" type="password" class="in" placeholder="New password"><input id="p2" type="password" class="in" placeholder="New password again">',showCancelButton:true,preConfirm:()=>{const a=$('p0').value,b=$('p1').value,c=$('p2').value;if(!a||b.length<6){Swal.showValidationMessage('New password min 6 characters');return false}if(b!==c){Swal.showValidationMessage('New passwords do not match');return false}return{a,b}}});if(!r.isConfirmed)return;
 try{const cr=firebase.auth.EmailAuthProvider.credential(me.email,r.value.a);await me.reauthenticateWithCredential(cr);await me.updatePassword(r.value.b);Swal.fire('Done','Password changed (this also changes your main-site password)','success')}catch(e){err(new Error(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'?'Old password is wrong':e.message))}}
async function addMoney(){const r=await Swal.fire({title:'Add Money',input:'number',inputLabel:'Min ৳'+CFG.minDeposit,showCancelButton:true});if(!r.isConfirmed)return;try{const j=await api('/tDepositCreate',{amount:+r.value,origin:location.origin});location.href=j.paymentUrl}catch(e){err(e)}}
async function withdraw(){const r=await Swal.fire({title:'Withdraw',html:`<div class="mut">Balance ৳${P.balance} • Min ৳${CFG.minWithdraw}</div><select id="wm" class="in"><option>bKash</option><option>Nagad</option></select><input id="wa" type="number" class="in" placeholder="Amount"><input id="w1" class="in" inputmode="numeric" placeholder="Number"><input id="w2" class="in" inputmode="numeric" placeholder="Number again">`,showCancelButton:true,preConfirm:()=>({method:$('wm').value,amount:+$('wa').value,number:$('w1').value,number2:$('w2').value})});if(!r.isConfirmed)return;
 try{const j=await api('/tWdRequest',r.value);await loadHome();Swal.fire({icon:'success',title:'Request sent',html:`Your key:<br><b style="font-size:18px">${esc(j.key)}</b><br><button class="btn o" onclick="cp('${esc(j.key)}')">Copy key</button><div class="mut">Give this key to support if needed.</div>`})}catch(e){err(e)}}
async function wdHist(){try{const j=await api('/tWdMine');const col={pending:'#eab308',done:'#22c55e',rejected:'#ef4444'};
 $('app').innerHTML='<div class="pad view stg"><div class="card"><b>Withdraw History</b></div>'+(j.items.map(i=>`<div class="card"><div class="row"><b>৳${i.amount} • ${esc(i.method)}</b><span class="pill" style="background:${col[i.status]};color:#fff">${i.status}</span></div><div class="mut">${esc(i.number)} • ${fmt(i.ts)}</div><div class="row"><span class="v" style="font-family:monospace">${esc(i.key)}</span><button class="btn o" onclick="cp('${esc(i.key)}')">Copy</button></div>${i.reason?'<div class="mut">'+esc(i.reason)+'</div>':''}</div>`).join('')||'<div class="msg">No withdrawals yet</div>')+'</div>'}catch(e){err(e)}}
boot();
</script></body></html>
