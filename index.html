<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M H X ADS WEBSITE</title>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #09090b 100%);
            --card-bg: rgba(17, 24, 39, 0.95);
            --border-color: rgba(56, 189, 248, 0.3);
            --accent-color: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --warning-color: #ffb703;
            --danger-color: #ef4444;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 22px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .header-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
        }

        .site-title {
            color: var(--accent-color);
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent-gradient);
            width: 0%;
            transition: width 0.4s ease;
        }

        .step-title {
            color: var(--text-main);
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .timer-display {
            font-size: 36px;
            font-weight: 900;
            color: var(--warning-color);
            margin: 5px 0;
        }

        .status-msg {
            font-size: 13px;
            font-weight: bold;
            color: var(--danger-color);
            margin-bottom: 12px;
        }

        .btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 13px;
            font-size: 15px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(14, 165, 233, 0.4);
            transition: all 0.3s ease;
        }

        .btn:disabled {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        .ad-action-box {
            margin: 15px 0;
            padding: 20px;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.1), rgba(99, 102, 241, 0.1));
            border: 2px dashed var(--accent-color);
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .ad-action-box:hover {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(99, 102, 241, 0.2));
            transform: translateY(-2px);
        }

        .ad-action-text {
            color: var(--accent-color);
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            display: block;
        }

        .hidden {
            display: none;
        }

        .error-box .step-title {
            color: var(--danger-color);
        }

        .btn-link {
            display: block;
            text-decoration: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- হেডার লোগো এবং নাম -->
        <div class="header-brand">
            <img src="https://i.ibb.co.com/YTJLH8zW/1792669720028.jpg" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
            <div class="site-title">M H X ADS WEBSITE</div>
            <img src="https://i.ibb.co.com/YTJLH8zW/1792669720028.jpg" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        </div>

        <!-- প্রোগ্রেস বার -->
        <div class="progress-bar-container">
            <div id="progress-fill" class="progress-bar"></div>
        </div>

        <!-- বটের লিংক ছাড়া সরাসরি ওয়েবসাইটে এলে / লিংক ভুল হলে -->
        <div id="error-view" class="error-box hidden">
            <div class="step-title">❌ লিংকটি সঠিক নয়</div>
            <p>এই ওয়েবসাইটটি সরাসরি খোলা যাবে না। টেলিগ্রাম বটে গিয়ে <b>📺 ADS</b> বাটনে ক্লিক করে নতুন লিংক নিন।</p>
            <a id="open-bot-btn" class="btn btn-link" href="#">🤖 বটে ফিরে যান</a>
        </div>

        <!-- কাজের ধাপ (বট যে ধাপ পাঠায় শুধু সেই ধাপই দেখাবে) -->
        <div id="task-view" class="hidden">
            <div id="step-title" class="step-title"></div>
            <p id="step-desc">নিচের বাক্সে ক্লিক করে অ্যাড ভিজিট করুন:</p>
            <div id="timer" class="timer-display"></div>
            <div id="status" class="status-msg">👉 টাইমার চালু করতে নিচের বক্সে ক্লিক করুন</div>

            <div id="ad-box" class="ad-action-box" role="button" tabindex="0">
                <span class="ad-action-text">🚀 অ্যাড দেখতে এখানে ক্লিক করুন</span>
            </div>

            <button id="continue-btn" class="btn" disabled>বটে ফিরে যান</button>
        </div>
    </div>

    <script>
        // ================= সেটিংস (এখানেই বদলান) =================
        const BOT_USERNAME = "MHXLIKE_BOT";   // বটের ইউজারনেম (@ ছাড়া) — শুধু ফলব্যাক রিটার্ন লিংকের জন্য
        const WAIT_SECONDS = 15;              // প্রতি ধাপে কত সেকেন্ড অপেক্ষা
        // অ্যাড লিংকের তালিকা: ধাপ ১ → ১ম লিংক, ধাপ ২ → ২য় লিংক ... শেষ হলে আবার প্রথম থেকে ঘুরবে।
        // তাই অ্যাডমিন প্যানেলে যত ধাপই সেট করুন, সাইট ঠিকমতো কাজ করবে।
        const AD_LINKS = [
            "https://afders.org/1/3c6e8faddb03e4ac21a51666d2ceb3b1",
            "https://bicea.org/14/7af884e8bf0804773feecf2b6f43c7b4"
        ];
        // =========================================================

        const bnDigits = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯"];
        const bn = (n) => String(n).replace(/\d/g, (d) => bnDigits[d]);

        const $ = (id) => document.getElementById(id);

        // URL থেকে বটের পাঠানো প্যারামিটার পড়া: ?step=&total=&token=&return=
        const params = new URLSearchParams(window.location.search);
        const step = parseInt(params.get("step"), 10);
        let total = parseInt(params.get("total"), 10);
        const token = (params.get("token") || "").trim();
        const returnParam = (params.get("return") || "").trim();

        // নিরাপত্তা: শুধু টেলিগ্রামের লিংকেই রিডাইরেক্ট হবে (অন্য সাইটে নয়)
        function safeReturnUrl() {
            if (returnParam) {
                try {
                    const u = new URL(returnParam);
                    const hostOk = (u.hostname === "t.me" || u.hostname === "telegram.me");
                    if (u.protocol === "https:" && hostOk) return u.toString();
                } catch (e) { /* নিচের ফলব্যাকে যাবে */ }
            }
            // ফলব্যাক: বটের ফরম্যাট অনুযায়ী নিজেই রিটার্ন লিংক বানানো
            if (/^[A-Za-z0-9]{8,64}$/.test(token) && step >= 1) {
                return "https://t.me/" + BOT_USERNAME + "?start=ads_s" + step + "_" + token;
            }
            return null;
        }

        const returnUrl = safeReturnUrl();
        const valid = Number.isInteger(step) && step >= 1 && step <= 100 &&
                      /^[A-Za-z0-9]{8,64}$/.test(token) && returnUrl;

        function showError() {
            $("task-view").classList.add("hidden");
            $("error-view").classList.remove("hidden");
            $("open-bot-btn").href = "https://t.me/" + BOT_USERNAME;
        }

        function init() {
            if (!valid) {
                showError();
                return;
            }
            if (!Number.isInteger(total) || total < step) total = step;
            if (total > 100) total = 100;

            $("task-view").classList.remove("hidden");
            const isLast = step === total;

            $("step-title").textContent = "ধাপ " + bn(step) + " / " + bn(total);
            $("step-desc").textContent = isLast
                ? "চূড়ান্ত ধাপ! নিচের বাক্সে ক্লিক করে অ্যাড ভিজিট করুন:"
                : "নিচের বাক্সে ক্লিক করে অ্যাড ভিজিট করুন:";
            $("timer").textContent = bn(WAIT_SECONDS);
            $("progress-fill").style.width = (((step - 1) / total) * 100) + "%";
            $("continue-btn").textContent = isLast ? "বটে ফিরে যান" : "বটে ফিরে যান (পরের ধাপের জন্য)";

            const adUrl = AD_LINKS[(step - 1) % AD_LINKS.length];
            const box = $("ad-box");
            box.addEventListener("click", () => handleAdClick(adUrl));
            box.addEventListener("keydown", (e) => {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    handleAdClick(adUrl);
                }
            });
            $("continue-btn").addEventListener("click", finishTask);
        }

        let started = false;
        let timerInterval = null;

        function handleAdClick(adUrl) {
            // নতুন ট্যাবে অ্যাড ওপেন হবে
            window.open(adUrl, "_blank", "noopener");

            // একই ধাপে আবার ক্লিক করলে টাইমার রিসেট হবে না
            if (started) return;
            started = true;

            const timerEl = $("timer");
            const statusEl = $("status");
            const btn = $("continue-btn");

            statusEl.textContent = "⏳ কাউন্টডাউন চলছে, অপেক্ষা করুন...";
            statusEl.style.color = "#ffb703";

            // সিস্টেম টাইম ধরে গণনা, যাতে ব্যাকগ্রাউন্ডে ট্যাব থাকলেও সঠিক সময় যায়
            const endAt = Date.now() + WAIT_SECONDS * 1000;
            timerInterval = setInterval(() => {
                const left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
                timerEl.textContent = bn(left);
                if (left <= 0) {
                    clearInterval(timerInterval);
                    timerEl.textContent = "সম্পন্ন!";
                    statusEl.textContent = "✅ সফল হয়েছে! এখন বটে ফিরে যান।";
                    statusEl.style.color = "#22c55e";
                    btn.disabled = false;
                    $("progress-fill").style.width = ((step / total) * 100) + "%";
                }
            }, 250);
        }

        function finishTask() {
            if ($("continue-btn").disabled || !returnUrl) return;
            window.location.href = returnUrl;
        }

        window.addEventListener("load", init);
    </script>
</body>
</html>
