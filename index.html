<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHX Reward & Ad System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4">

    <!-- Header Section -->
    <div class="w-full max-w-md text-center mt-6">
        <h1 class="text-2xl font-bold text-emerald-400">MHX Task & Reward System</h1>
        <p class="text-gray-400 text-sm mt-1">পরবর্তী ধাপে যেতে নিচের বিজ্ঞাপনটি সম্পূর্ণ দেখুন</p>
    </div>

    <!-- Main Ad & Timer Container -->
    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl text-center my-auto">
        
        <!-- Ad Banner Box -->
        <div id="ad-container" class="w-full min-h-52 bg-slate-900 rounded-xl flex flex-col justify-center items-center relative overflow-hidden border border-slate-700 p-2">
            <div class="absolute top-2 right-2 bg-red-600 text-xs px-2 py-1 rounded font-bold uppercase tracking-wider z-20">Sponsored Ad</div>
            
            <div id="ad-content" class="w-full h-full flex justify-center items-center">
                
                <!-- ============================================================ -->
                <!-- 🔽 আপনার Adsterra থেকে পাওয়া জাভাস্ক্রিপ্ট অ্যাড কোডটি এখানে পেস্ট করবেন 🔽 -->
                <!-- ============================================================ -->
                
                <script type="text/javascript">
                    // আপনার অ্যাড কোডটি এখানে বসবে
                </script>
                
                <!-- ============================================================ -->

            </div>
        </div>

        <!-- Timer & Status Text -->
        <div class="mt-6">
            <p id="timer-text" class="text-sm text-gray-300">অ্যাড শেষ হতে বাকি: <span id="countdown" class="font-bold text-yellow-400 text-lg">15</span> সেকেন্ড</p>
            <div class="w-full bg-slate-700 h-2 rounded-full mt-3 overflow-hidden">
                <div id="progress-bar" class="bg-emerald-500 h-full w-full transition-all duration-1000"></div>
            </div>
        </div>

        <!-- Continue / Back Button -->
        <button id="next-btn" disabled class="w-full mt-6 py-3 px-4 bg-gray-600 text-gray-400 font-bold rounded-xl cursor-not-allowed transition-all shadow-lg">
            অ্যাড দেখা শেষ (অপেক্ষা করুন...)
        </button>
    </div>

    <!-- Footer -->
    <div class="w-full max-w-md text-center text-xs text-gray-500 mb-2">
        Powered by Telegram Mini App & MHX System
    </div>

    <!-- JavaScript Logic -->
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let timeLeft = 15;
        const countdownElement = document.getElementById('countdown');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');

        const urlParams = new URLSearchParams(window.location.search);
        let currentStep = urlParams.get('step') || '1';

        let totalTime = timeLeft;
        let timer = setInterval(function() {
            timeLeft--;
            countdownElement.innerText = timeLeft;
            
            let progressPercentage = (timeLeft / totalTime) * 100;
            progressBar.style.width = progressPercentage + '%';

            if (timeLeft <= 0) {
                clearInterval(timer);
                
                nextBtn.disabled = false;
                nextBtn.classList.remove('bg-gray-600', 'text-gray-400', 'cursor-not-allowed');
                nextBtn.classList.add('bg-emerald-500', 'text-white', 'hover:bg-emerald-600', 'cursor-pointer');
                nextBtn.innerText = "বটে ফিরে যান ➔";

                setTimeout(function() {
                    redirectToBot(currentStep);
                }, 2000);
            }
        }, 1000);

        nextBtn.addEventListener('click', function() {
            if (!nextBtn.disabled) {
                redirectToBot(currentStep);
            }
        });

        function redirectToBot(step) {
            let botUsername = "MHXLIKE_BOT";
            let targetUrl = `https://t.me/${botUsername}?start=free_s${step}`;
            
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(targetUrl);
            } else {
                window.location.href = targetUrl;
            }
        }
    </script>
</body>
</html>
