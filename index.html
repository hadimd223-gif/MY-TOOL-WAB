<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M H X ADS WEBSITE</title>
    
    <!-- আপনার সোশ্যাল বার অ্যাড কোড -->
    <script data-cfasync="false" src="https://bicea.org/14/7af884e8bf0804773feecf2b6f43c7b4"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }
        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .site-title {
            color: #38bdf8;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            letter-spacing: 1px;
        }
        .step-title {
            color: #f1f5f9;
            font-size: 18px;
            margin-bottom: 10px;
        }
        p {
            font-size: 15px;
            color: #cbd5e1;
            margin: 10px 0;
        }
        .timer-display {
            font-size: 32px;
            font-weight: bold;
            color: #facc15;
            margin: 15px 0;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        .btn:hover:not(:disabled) {
            background-color: #1d4ed8;
        }
        .step-content {
            display: none;
        }
        .step-content.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ওয়েবসাইটের নাম -->
        <div class="site-title">M H X ADS WEBSITE</div>

        <!-- ধাপ ১ -->
        <div id="step-1" class="step-content active">
            <div class="step-title">ধাপ ১ / ৪</div>
            <p>পরবর্তী ধাপে যাওয়ার জন্য অপেক্ষা করুন:</p>
            <div id="timer-1" class="timer-display">৩০</div>
            <button id="btn-1" class="btn" disabled>অপেক্ষা করুন...</button>
        </div>

        <!-- ধাপ ২ -->
        <div id="step-2" class="step-content">
            <div class="step-title">ধাপ ২ / ৪</div>
            <p>দয়া করে ১৫ সেকেন্ড অপেক্ষা করুন:</p>
            <div id="timer-2" class="timer-display">১৫</div>
            <button id="btn-2" class="btn" disabled>অপেক্ষা করুন...</button>
        </div>

        <!-- ধাপ ৩ -->
        <div id="step-3" class="step-content">
            <div class="step-title">ধাপ ৩ / ৪</div>
            <p>আর একটু অপেক্ষা করুন (১৫ সেকেন্ড):</p>
            <div id="timer-3" class="timer-display">১৫</div>
            <button id="btn-3" class="btn" disabled>অপেক্ষা করুন...</button>
        </div>

        <!-- ধাপ ৪ -->
        <div id="step-4" class="step-content">
            <div class="step-title">ধাপ ৪ / ৪</div>
            <p>শেষ ধাপ! ৩০ সেকেন্ড অপেক্ষা করুন:</p>
            <div id="timer-4" class="timer-display">৩০</div>
            <button id="btn-4" class="btn" disabled>অপেক্ষা করুন...</button>
        </div>
    </div>

    <!-- আপনার পপআন্ডার অ্যাড কোড -->
    <script data-cfasync="false" src="https://afders.org/1/3c6e8faddb03e4ac21a51666d2ceb3b1"></script>

    <script>
        // এখানে আপনার টেলিগ্রাম বটের লিংকটি বসিয়ে দিন
        const telegramBotUrl = "https://t.me/YourBotUsername";

        function startTimer(duration, timerElementId, buttonElementId, onComplete) {
            let timer = duration;
            const timerElement = document.getElementById(timerElementId);
            const buttonElement = document.getElementById(buttonElementId);

            const interval = setInterval(function () {
                timerElement.textContent = timer;

                if (--timer < 0) {
                    clearInterval(interval);
                    timerElement.textContent = "সম্পন্ন!";
                    buttonElement.disabled = false;
                    buttonElement.textContent = "কন্টিনিউ করুন";
                    if (onComplete) onComplete();
                }
            }, 1000);
        }

        function goToStep(stepNumber) {
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById('step-' + stepNumber).classList.add('active');

            if (stepNumber === 1) {
                startTimer(30, 'timer-1', 'btn-1', () => {
                    document.getElementById('btn-1').onclick = () => goToStep(2);
                });
            } else if (stepNumber === 2) {
                startTimer(15, 'timer-2', 'btn-2', () => {
                    document.getElementById('btn-2').onclick = () => goToStep(3);
                });
            } else if (stepNumber === 3) {
                startTimer(15, 'timer-3', 'btn-3', () => {
                    document.getElementById('btn-3').onclick = () => goToStep(4);
                });
            } else if (stepNumber === 4) {
                startTimer(30, 'timer-4', 'btn-4', () => {
                    document.getElementById('btn-4').onclick = () => {
                        window.location.href = telegramBotUrl;
                    };
                });
            }
        }

        // প্রথম ধাপ দিয়ে টাস্ক শুরু হবে
        window.onload = function() {
            goToStep(1);
        };
    </script>
</body>
</html>
