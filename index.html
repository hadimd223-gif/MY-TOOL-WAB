<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHX Reward & Ad System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4">

    <!-- Header Section -->
    <div class="w-full max-w-md text-center mt-6">
        <h1 class="text-2xl font-bold text-emerald-400">MHX Task & Reward System</h1>
        <p class="text-gray-400 text-sm mt-1">পরবর্তী ধাপে যেতে নিচের বিজ্ঞাপনটি সম্পূর্ণ দেখুন</p>
    </div>

    <!-- Main Ad & Timer Container -->
    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl text-center my-auto">
        
        <!-- Ad Banner Box -->
        <div id="ad-container" class="w-full min-h-52 bg-slate-900 rounded-xl flex flex-col justify-center items-center relative overflow-hidden border border-slate-700 p-2">
            <div class="absolute top-2 right-2 bg-red-600 text-xs px-2 py-1 rounded font-bold uppercase tracking-wider z-20">Sponsored Ad</div>
            
            <div id="ad-content" class="w-full h-full flex justify-center items-center">
                
                <!-- ============================================================ -->
                <!-- 🔽 আপনার অ্যাড নেটওয়ার্কের (Adsterra / Monetag) কোড নিচে বসান 🔽 -->
                <!-- ============================================================ -->
                
                <script type="text/javascript">
                    /* Adsterra বা Monetag থেকে দেওয়া Javascript/Ad Script কোডটি এখানে পেস্ট করবেন */
                </script>
                
                <!-- অ্যাড লোড না হওয়া পর্যন্ত সাময়িক মেসেজ -->
                <div id="fallback-ad-msg" class="text-center py-4">
                    <svg class="w-10 h-10 text-emerald-500 mx-auto animate-pulse mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <p class="text-sm text-gray-300 font-semibold">বিজ্ঞাপনটি লোড হচ্ছে...</p>
                </div>

                <!-- ============================================================ -->

            </div>
        </div>

        <!-- Timer & Status Text -->
        <div class="mt-6">
            <p id="timer-text" class="text-sm text-gray-300">অ্যাড শেষ হতে বাকি: <span id="countdown" class="font-bold text-yellow-400 text-lg">15</span> সেকেন্ড</p>
            <div class="w-full bg-slate-700 h-2 rounded-full mt-3 overflow-hidden">
                <div id="progress-bar" class="bg-emerald-500 h-full w-full transition-all duration-1000"></div>
            </div>
        </div>

        <!-- Continue / Back Button -->
        <button id="next-btn" disabled class="w-full mt-6 py-3 px-4 bg-gray-600 text-gray-400 font-bold rounded-xl cursor-not-allowed transition-all shadow-lg">
            অ্যাড দেখা শেষ (অপেক্ষা করুন...)
        </button>
    </div>

    <!-- Footer -->
    <div class="w-full max-w-md text-center text-xs text-gray-500 mb-2">
        Powered by Telegram Mini App & MHX System
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Telegram Web App Initialize
        let tg = window.Telegram.WebApp;
        tg.expand();

        let timeLeft = 15; // ১৫ সেকেন্ড টাইমার
        const countdownElement = document.getElementById('countdown');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const fallbackMsg = document.getElementById('fallback-ad-msg');

        let totalTime = timeLeft;
        let timer = setInterval(function() {
            timeLeft--;
            countdownElement.innerText = timeLeft;
            
            // Progress bar update
            let progressPercentage = (timeLeft / totalTime) * 100;
            progressBar.style.width = progressPercentage + '%';

            if (timeLeft <= 0) {
                clearInterval(timer);
                
                // সফলভাবে দেখার মেসেজ
                if (fallbackMsg) {
                    fallbackMsg.innerHTML = `
                        <svg class="w-10 h-10 text-emerald-400 mx-auto mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                        <p class="text-sm font-bold text-emerald-400">অ্যাড সফলভাবে দেখা হয়েছে!</p>
                    `;
                }
                
                // Enable Button
                nextBtn.disabled = false;
                nextBtn.classList.remove('bg-gray-600', 'text-gray-400', 'cursor-not-allowed');
                nextBtn.classList.add('bg-emerald-500', 'text-white', 'hover:bg-emerald-600', 'cursor-pointer');
                nextBtn.innerText = "বটে ফিরে যান ➔ (অটোমেটিক রিলোড হবে)";

                // অটোমেটিক ২-৩ সেকেন্ডের মধ্যে মিনি অ্যাপ বন্ধ করে বটে ফেরত পাঠানোর লজিক
                setTimeout(function() {
                    tg.close();
                }, 2000);
            }
        }, 1000);

        // ম্যানুয়াল ক্লিকেও বটে ফেরত যাবে
        nextBtn.addEventListener('click', function() {
            if (!nextBtn.disabled) {
                tg.close();
            }
        });
    </script>
</body>
</html>
