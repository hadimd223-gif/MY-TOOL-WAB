<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাড ভেরিফিকেশন সিস্টেম - AdMob</title>
    
    <!-- Google AdMob / AdSense Script Integration -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-app-pub-9467019896900554~2608224645" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
        }
        .progress-box {
            font-size: 18px;
            margin: 20px 0;
            font-weight: bold;
            color: #fbbf24;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background-color: #0369a1;
        }
        .btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        .code-box {
            background: #0f172a;
            border: 2px dashed #38bdf8;
            padding: 15px;
            font-size: 20px;
            letter-spacing: 2px;
            font-weight: bold;
            color: #4ade80;
            margin: 15px 0;
            border-radius: 6px;
            word-break: break-all;
        }
        .hidden {
            display: none;
        }
        #status-msg {
            color: #f87171;
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h2>অ্যাড ভেরিফিকেশন</h2>
        <p>এগিয়ে যাওয়ার জন্য আপনাকে অবশ্যই অ্যাড দেখতে হবে। অ্যাড না দেখলে পরবর্তী ধাপে যাওয়া যাবে না।</p>
        
        <div class="progress-box" id="progress-text">অ্যাড দেখা হয়েছে: ০/৫</div>

        <!-- অ্যাড দেখার বাটন -->
        <button class="btn" id="next-ad-btn" onclick="watchAdMobAd()">অ্যাড দেখে এগিয়ে যান</button>
        <p id="status-msg"></p>
    </div>

    <!-- কোড পাওয়ার পর দেখানোর বক্স -->
    <div class="card hidden" id="success-card">
        <h2>অভিনন্দন! 🎉</h2>
        <p>আপনার ৫টি অ্যাড দেখা সম্পূর্ণ হয়েছে। নিচের কোডটি কপি করে টেলিগ্রাম বটে দিন:</p>
        
        <div class="code-box" id="verification-code">LOAD1234</div>
        
        <button class="btn" onclick="copyCode()" id="copy-btn">কোড কপি করুন</button>
        <p id="copy-msg" style="color: #4ade80; margin-top: 10px; display: none;">কোডটি সফলভাবে কপি হয়েছে! এবার বটে গিয়ে পেস্ট করুন।</p>
    </div>

    <script>
        // আপনার দেওয়া AdMob অ্যাড ইউনিট আইডিগুলোর তালিকা
        const admobUnits = [
            "ca-app-pub-9467019896900554/3758663944",
            "ca-app-pub-9467019896900554/6576398978",
            "ca-app-pub-9467019896900554/3355551299",
            "ca-app-pub-9467019896900554/3733604059",
            "ca-app-pub-9467019896900554/6355897969",
            "ca-app-pub-9467019896900554/3083876525"
        ];

        let adCount = parseInt(localStorage.getItem('user_ad_count')) || 0;
        const totalAds = 5;

        function updateUI() {
            if (adCount >= totalAds) {
                document.getElementById('main-card').classList.add('hidden');
                document.getElementById('success-card').classList.remove('hidden');
                
                let uniqueCode = "VERIFY-" + Math.random().toString(36).substring(2, 8).toUpperCase();
                document.getElementById('verification-code').innerText = uniqueCode;
                
                localStorage.removeItem('user_ad_count');
            } else {
                document.getElementById('progress-text').innerText = `অ্যাড দেখা হয়েছে: ${adCount}/${totalAds}`;
            }
        }

        function watchAdMobAd() {
            const btn = document.getElementById('next-ad-btn');
            const statusMsg = document.getElementById('status-msg');
            
            btn.disabled = true;
            btn.innerText = "অ্যাড লোড হচ্ছে...";
            statusMsg.innerText = "দয়া করে সম্পূর্ণ অ্যাডটি দেখুন...";

            // বর্তমান ধাপ অনুযায়ী AdMob ইউনিট সিলেক্ট করা
            let currentAdUnit = admobUnits[adCount % admobUnits.length];
            console.log("Loading AdMob Unit: " + currentAdUnit);

            // এখানে AdMob লোড হওয়ার সিমুলেশন বা আসল রিমোট অ্যাড কল হবে। 
            // ইউজার অ্যাড সম্পূর্ণ দেখার পর এই ফাংশনটি ট্রিগার হবে (যেমন: AdMob Rewarded/Interstitial Close ইভেন্ট)
            setTimeout(() => {
                // ধরে নিচ্ছি ইউজার সফলভাবে অ্যাড দেখে শেষ করেছে
                let adWatchedSuccessfully = true; // এটি আসল অ্যাপে AdMob এর callback থেকে আসবে

                if (adWatchedSuccessfully) {
                    adCount++;
                    localStorage.setItem('user_ad_count', adCount);
                    statusMsg.innerText = "";
                    updateUI();
                } else {
                    statusMsg.innerText = "অ্যাড সম্পূর্ণ দেখা হয়নি! দয়া করে সম্পূর্ণ অ্যাড দেখুন।";
                }

                btn.disabled = false;
                btn.innerText = "অ্যাড দেখে এগিয়ে যান";
            }, 3000); // ৩ সেকেন্ডের একটি অ্যাড দেখার সিমুলেশন সময় (আপনার প্রয়োজনমতো পরিবর্তন করতে পারেন)
        }

        window.onload = function() {
            updateUI();
        };

        function copyCode() {
            const codeText = document.getElementById('verification-code').innerText;
            navigator.clipboard.writeText(codeText).then(() => {
                const msg = document.getElementById('copy-msg');
                msg.style.display = 'block';
                setTimeout(() => {
                    msg.style.display = 'none';
                }, 3000);
            });
        }
    </script>

</body>
</html>
