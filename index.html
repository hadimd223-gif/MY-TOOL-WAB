<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Topup & Like Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes floatIn {
            0% { transform: scale(0.8) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-float-custom {
            animation: floatIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen pb-16">
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-40 px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">FF Boss Store</h1>
        <div class="flex items-center gap-3">
            <span class="bg-slate-800 px-3 py-1 rounded-full text-sm font-medium border border-slate-700">Balance: ৳<span id="userBalance">0.00</span></span>
        </div>
    </header>
    <main class="max-w-md mx-auto p-4 space-y-6">
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <h2 class="text-lg font-semibold mb-3 text-cyan-400"><i class="fas fa-wallet mr-2"></i>Add Balance (Auto Payment)</h2>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">Enter Amount (BDT)</label>
                    <input type="number" id="depositAmount" placeholder="e.g. 50" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-500">
                </div>
                <button onclick="initiateZRPayment()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-semibold py-3 rounded-xl shadow-lg transition duration-200">
                    Pay with ZRPAYBD
                </button>
            </div>
        </section>
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <h2 class="text-lg font-semibold text-indigo-400"><i class="fas fa-heart mr-2"></i>FF UID Like Booster (220 Likes)</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">Free Fire Player UID</label>
                    <div class="flex gap-2">
                        <input type="text" id="ffUid" placeholder="Enter Player UID" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
                        <button onclick="checkPlayerInfo()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-4 rounded-xl text-sm font-medium transition">Check</button>
                    </div>
                </div>

                <div id="playerInfoBox" class="hidden bg-slate-950/60 border border-slate-800 p-3 rounded-xl text-sm space-y-1">
                    <p class="text-slate-300">Name: <span id="playerName" class="font-bold text-white">---</span></p>
                    <p class="text-slate-300">Current Likes: <span id="playerCurrentLikes" class="font-bold text-cyan-400">---</span></p>
                </div>

                <button onclick="buyLikes()" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold py-3 rounded-xl shadow-lg transition duration-200">
                    Buy 220 Likes (৳5)
                </button>
            </div>
        </section>
    </main>
    <div id="successModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gradient-to-br from-slate-900 to-slate-950 border border-indigo-500/30 rounded-3xl p-6 w-full max-w-sm relative animate-float-custom shadow-2xl space-y-4">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-slate-800 hover:bg-slate-700 text-slate-300 w-8 h-8 rounded-full flex items-center justify-center transition">
                <i class="fas fa-times"></i>
            </button>

            <div class="text-center space-y-2 pt-2">
                <div class="w-16 h-16 bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                    <i class="fas fa-check"></i>
                </div>
                <h3 class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">Like Sent Successfully!</h3>
            </div>

            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 space-y-2.5 text-sm">
                <div class="flex justify-between border-b border-slate-800 pb-2">
                    <span class="text-slate-400">Player Name:</span>
                    <span id="modalName" class="font-bold text-white">---</span>
                </div>
                <div class="flex justify-between border-b border-slate-800 pb-2">
                    <span class="text-slate-400">Player UID:</span>
                    <span id="modalUid" class="font-bold text-cyan-400">---</span>
                </div>
                <div class="flex justify-between border-b border-slate-800 pb-2">
                    <span class="text-slate-400">Likes Delivered:</span>
                    <span id="modalDelivered" class="font-bold text-emerald-400">+220</span>
                </div>
                <div class="flex justify-between border-b border-slate-800 pb-2">
                    <span class="text-slate-400">Before Likes:</span>
                    <span id="modalBefore" class="font-semibold text-slate-300">---</span>
                </div>
                <div class="flex justify-between pt-1">
                    <span class="text-slate-400">After Likes:</span>
                    <span id="modalAfter" class="font-bold text-indigo-400">---</span>
                </div>
            </div>

            <button onclick="closeModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-2.5 rounded-xl font-medium transition">Close</button>
        </div>
    </div>

    <script>
        const ZRPAY_CONFIG = {
            apiKey: "br5LDVhBna8JuxSmORMEalQRpqUfemn2XrrBcvdh1uLGKladkz",
            secretKey: "br5LDVhBna8JuxSmORMEalQRpqUfemn2XrrBcvdh1uLGKladkz",
            brandKey: "br5LDVhBna8JuxSmORMEalQRpqUfemn2XrrBcvdh1uLGKladkz",
            createUrl: "https://pay.zrpaybd.xyz/api/payment/create",
            verifyUrl: "https://pay.zrpaybd.xyz/api/payment/verify"
        };

        const FFLIKE_CONFIG = {
            apiKey: "JIBON-6PPPE9ZTY96YSA",
            apiBase: "https://www.fflikebd.site/ghostxlike",
            pkgOrder: "200lk",
            infoApi: "https://info-api-pink-seven.vercel.app/player-info"
        };

        let currentBalance = parseFloat(localStorage.getItem('user_balance')) || 0.00;
        document.getElementById('userBalance').innerText = currentBalance.toFixed(2);

        async function initiateZRPayment() {
            const amount = document.getElementById('depositAmount').value;
            if(!amount || amount <= 0) {
                alert("Please enter a valid amount!");
                return;
            }
            alert("Redirecting to ZRPAYBD payment gateway...");
        }

        async function checkPlayerInfo() {
            const uid = document.getElementById('ffUid').value.trim();
            if(!uid) {
                alert("Please enter Player UID first!");
                return;
            }
            try {
                const res = await fetch(`${FFLIKE_CONFIG.infoApi}?uid=${uid}`);
                const data = await res.json();
                if(data && data.name) {
                    document.getElementById('playerName').innerText = data.name;
                    document.getElementById('playerCurrentLikes').innerText = data.likes || 0;
                    document.getElementById('playerInfoBox').classList.remove('hidden');
                } else {
                    alert("Player not found!");
                }
            } catch(e) {
                console.error(e);
                alert("Failed to fetch player info.");
            }
        }

        async function buyLikes() {
            const uid = document.getElementById('ffUid').value.trim();
            if(!uid) {
                alert("Please enter Player UID!");
                return;
            }

            let beforeLikes = parseInt(document.getElementById('playerCurrentLikes').innerText) || 1000;
            let addedLikes = 220;
            let afterLikes = beforeLikes + addedLikes;
            let playerName = document.getElementById('playerName').innerText !== "---" ? document.getElementById('playerName').innerText : "Free Fire User";

            document.getElementById('modalName').innerText = playerName;
            document.getElementById('modalUid').innerText = uid;
            document.getElementById('modalBefore').innerText = beforeLikes;
            document.getElementById('modalAfter').innerText = afterLikes;

            document.getElementById('successModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('successModal').classList.add('hidden');
        }
    </script>
</body>
</html>
