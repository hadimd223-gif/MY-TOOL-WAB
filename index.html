<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Maintenance - M H X TOPUP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        @keyframes glowPulse {
            0% { text-shadow: 0 0 10px rgba(56, 189, 248, 0.5), 0 0 20px rgba(56, 189, 248, 0.3); transform: scale(1); }
            50% { text-shadow: 0 0 25px rgba(236, 72, 153, 0.8), 0 0 40px rgba(56, 189, 248, 0.6); transform: scale(1.03); }
            100% { text-shadow: 0 0 10px rgba(56, 189, 248, 0.5), 0 0 20px rgba(56, 189, 248, 0.3); transform: scale(1); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .maintenance-title {
            animation: glowPulse 3s infinite ease-in-out, fadeInUp 1s ease-out forwards;
            background: linear-gradient(135deg, #38bdf8 0%, #ec4899 50%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .animate-card {
            animation: fadeInUp 0.8s ease-out forwards;
        }
    </style>
</head>
<body class="bg-black text-white p-4">
    <div class="max-w-md w-full mx-auto text-center p-6 bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl animate-card space-y-6">
        
        <!-- Animated Icon -->
        <div class="w-20 h-20 bg-gradient-to-tr from-sky-500/20 to-pink-500/20 border border-sky-500/30 rounded-full flex items-center justify-center mx-auto shadow-lg animate-pulse">
            <i class="fas fa-tools text-3xl text-sky-400"></i>
        </div>

        <!-- Big Colorful Maintenance Heading -->
        <div class="space-y-2">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-wider uppercase maintenance-title">
                Maintenance
            </h1>
            <p class="text-xs text-slate-400 tracking-widest uppercase font-semibold">System Update in Progress</p>
        </div>

        <!-- Bengali Description -->
        <div class="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl text-xs md:text-sm text-slate-300 leading-relaxed space-y-2 shadow-inner">
            <p class="font-medium text-slate-200">আমাদের ওয়েবসাইটটিতে বর্তমানে গুরুত্বপূর্ণ আপডেট ও কাজ চলতেছে।</p>
            <p class="text-slate-400">আপাতత আপনারা আমাদের টেলিগ্রাম বট বা চ্যানেলের মাধ্যমে আমাদের সাথে যুক্ত থাকুন।</p>
        </div>

        <!-- Join Telegram Button with Redirect -->
        <div class="pt-2">
            <a href="https://t.me/MHXLIKE_BOT" target="_blank" class="w-full bg-gradient-to-r from-sky-500 via-blue-600 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white font-bold py-3.5 px-6 rounded-2xl shadow-xl flex items-center justify-center gap-3 transition-all duration-300 transform hover:scale-[1.02] active:scale-95 text-sm uppercase tracking-wide border border-sky-400/30">
                <i class="fab fa-telegram-plane text-xl"></i>
                Join Telegram
            </a>
        </div>

        <div class="text-[10px] text-slate-500 pt-2">
            &copy; 2026 M H X TOPUP. All Rights Reserved.
        </div>
    </div>

    <script>
        // Optional: Auto redirect after 6 seconds directly to Telegram bot if needed, 
        // or let users click the button manually. (Currently set to manual click via button for safety).
    </script>
</body>
</html>
