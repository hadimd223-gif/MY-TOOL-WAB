<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Tool Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 50px;
        }
        .bg-video-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; z-index: -2; overflow: hidden;
        }
        .bg-video-container video {
            width: 100%; height: 100%; object-fit: cover;
        }
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(10px);
            z-index: -1;
        }
        .main-container {
            width: 100%;
            max-width: 480px;
            padding: 15px;
            z-index: 1;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 18px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .brand-title {
            font-size: 17px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff7e5f, #feb47b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .admin-btn {
            background: #3b82f6;
            color: #fff;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #38bdf8;
            margin: 15px 0 10px 5px;
            border-left: 4px solid #38bdf8;
            padding-left: 8px;
        }
        /* পুতিবাজার স্টাইল গ্রিড কার্ড */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .grid-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            text-align: center;
            padding: 12px 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .grid-card:active {
            transform: scale(0.95);
            border-color: #ff7e5f;
        }
        .grid-card .card-thumb {
            width: 100%;
            height: 55px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #3a0ca3, #7209b7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .grid-card span {
            font-size: 11px;
            color: #f1f5f9;
            font-weight: 600;
            display: block;
            line-height: 1.3;
        }
        /* ডায়নামিক টুল বা মডাল বক্স স্টাইল */
        .tool-modal {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }
        .input-group { text-align: left; margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 4px; }
        .input-group input, .input-group select {
            width: 100%; padding: 10px; background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: #fff; font-size: 13px; outline: none;
        }
        .btn-action {
            width: 100%; padding: 10px; background: linear-gradient(135deg, #ff7e5f, #feb47b);
            border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="bg-video-container">
        <video autoplay muted loop playsinline>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-and-numbers-31919-large.mp4" type="video/mp4">
        </video>
    </div>
    <div class="bg-overlay"></div>
    <div class="main-container">
        <!-- টপ বার -->
        <div class="top-bar">
            <div class="brand-title">🔥 FF TOOL HUB</div>
            <button class="admin-btn" onclick="toggleAdminPanel()">⚙️ অ্যাডমিন প্যানেল</button>
        </div>

        <!-- অ্যাডমিন প্যানেল (কাস্টমাইজেশন ও মেইনটেনেন্স কন্ট্রোল) -->
        <div id="adminPanel" class="tool-modal" style="border-color: #38bdf8;">
            <h3 style="color: #38bdf8; font-size: 15px; margin-bottom: 10px;">🛠️ অ্যাডমিন কন্ট্রোল ও কাস্টমাইজেশন</h3>
            <p style="font-size: 11px; color: #94a3b8; margin-bottom: 12px;">যেকোনো অপশন অন/অফ বা নতুন বাটন যোগ করুন</p>
            
            <div class="input-group">
                <label>বাটন অন/অফ (মেইনটেনেন্স কন্ট্রোল)</label>
                <select id="adminToolSelect" onchange="loadToolStatus()">
                    <option value="profile_check">প্রোফাইল চেক</option>
                    <option value="jwt_token">JWT টোকেন জেনারেট</option>
                    <option value="likes_220">২২০টি লাইক অপশন</option>
                </select>
            </div>
            <div class="input-group">
                <label>স্ট্যাটাস সিলেক্ট করুন</label>
                <select id="adminStatusSelect">
                    <option value="false">সচল (Normal)</option>
                    <option value="true">মেইনটেনেন্সে রাখুন (Maintenance)</option>
                </select>
            </div>
            <button class="btn-action" onclick="saveAdminSettings()" style="margin-bottom: 15px;">পরিবর্তন সংরক্ষণ করুন</button>

            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">

            <h4 style="color: #ff7e5f; font-size: 13px; margin-bottom: 8px;">➕ নতুন বাটন যোগ করুন বা কাস্টমাইজ করুন</h4>
            <div class="input-group">
                <label>বাটনের নাম (যেমন: Custom Tool)</label>
                <input type="text" id="newBtnKey" placeholder="যেমন: custom_tool">
            </div>
            <div class="input-group">
                <label>ডিসপ্লে নাম (বাংলায়)</label>
                <input type="text" id="newBtnName" placeholder="যেমন: স্পেশাল ডায়মন্ড টপআপ">
            </div>
            <div class="input-group">
                <label>থাম্বনেইল ইমোজি বা ছবির লিংক (URL)</label>
                <input type="text" id="newBtnThumb" placeholder="যেমন: 💎 অথবা ছবির লিংক">
            </div>
            <button class="btn-action" onclick="addNewToolButton()">নতুন বাটন যুক্ত করুন</button>
        </div>

        <!-- ডায়নামিক টুল রান করার বক্স -->
        <div id="toolExecutionBox" class="tool-modal">
            <h3 id="modalTitle" style="color: #ff7e5f; font-size: 15px; margin-bottom: 10px;">টুল রান করুন</h3>
            <div id="modalBody"></div>
        </div>

        <!-- সেকশন টাইটেল -->
        <div class="section-title">FF TOOLS & SERVICES</div>

        <!-- পুতিবাজার স্টাইল গ্রিড বক্সগুলো -->
        <div class="grid-container" id="dynamicGridContainer">
            <!-- জাভাস্ক্রিপ্ট দিয়ে ডাইনামিক্যালি কার্ড লোড হবে -->
        </div>

        <!-- ইউজার হিস্টরি বক্স -->
        <div style="background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 15px; margin-top: 15px;">
            <h3 style="font-size: 13px; color: #38bdf8; margin-bottom: 8px;">📜 আপনার হিস্টরি</h3>
            <div id="historyList" style="font-size: 11px; color: #94a3b8; max-height: 100px; overflow-y: auto;">
                <div>কোনো হিস্টরি নেই</div>
            </div>
        </div>
    </div>
    <script>
        // ডিফল্ট টুলস ডাটা (যা পুতিবাজার স্টাইলে গ্রিডে দেখাবে)
        let defaultTools = [
            { key: "profile_check", name: "প্রোফাইল চেক", thumb: "🔍" },
            { key: "jwt_token", name: "JWT টোকেন জেনারেট", thumb: "🔑" },
            { key: "likes_220", name: "ফ্রি ফায়ার ২২০ লাইক", thumb: "❤️" }
        ];

        // লোকালস্টোরেজ থেকে টুল লিস্ট লোড করা (এডমিন যদি নতুন অ্যাড করে থাকে)
        function getToolsList() {
            let saved = localStorage.getItem("custom_tools_list");
            return saved ? JSON.parse(saved) : defaultTools;
        }

        function renderGrid() {
            const container = document.getElementById("dynamicGridContainer");
            const tools = getToolsList();
            container.innerHTML = tools.map(tool => `
                <div class="grid-card" onclick="handleToolClick('${tool.key}', '${tool.name}')">
                    <div class="card-thumb">${tool.thumb}</div>
                    <span>${tool.name}</span>
                </div>
            `).join('');
        }

        // হিস্টরি ম্যানেজমেন্ট
        function addHistory(actionText) {
            let history = JSON.parse(localStorage.getItem("user_history") || "[]");
            const timeStr = new Date().toLocaleTimeString();
            history.unshift(`[${timeStr}] ${actionText}`);
            if (history.length > 15) history.pop();
            localStorage.setItem("user_history", JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            let history = JSON.parse(localStorage.getItem("user_history") || "[]");
            const container = document.getElementById("historyList");
            if (container) {
                container.innerHTML = history.length === 0 ? '<div>কোনো হিস্টরি নেই</div>' : history.map(item => `<div style="padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05);">${item}</div>`).join('');
            }
        }

        // টুল ক্লিক করলে চেক করবে মেইনটেনেন্সে আছে কি না
        function handleToolClick(key, name) {
            const isMaintenance = localStorage.getItem("maintenance_" + key) === "true";
            if (isMaintenance) {
                alert("⚠️ এই অপশনটি এখন মেইনটেনেন্সে আছে!");
                addHistory(`[মেইনটেনেন্স] ${name} ব্যবহারের চেষ্টা করা হয়েছে।`);
                return;
            }

            // টুল ওপেন করার মডাল লজিক
            const modal = document.getElementById("toolExecutionBox");
            const title = document.getElementById("modalTitle");
            const body = document.getElementById("modalBody");
            
            modal.style.display = "block";
            title.innerText = name;

            if(key === "profile_check") {
                body.innerHTML = `
                    <div class="input-group"><label>প্লেয়ার UID দিন</label><input type="text" id="modalUid" placeholder="যেমন: 12997366310"></div>
                    <button class="btn-action" onclick="runProfileCheck()">প্রোফাইল ফেচ করুন</button>
                    <div id="modalResult" style="margin-top: 10px; font-size: 12px;"></div>
                `;
            } else if(key === "likes_220") {
                body.innerHTML = `
                    <div class="input-group"><label>আপনার UID দিন (২২০ লাইকের জন্য)</label><input type="text" id="modalUid" placeholder="UID দিন"></div>
                    <button class="btn-action" onclick="runLikesBoost()">লাইক রিকোয়েস্ট পাঠান</button>
                    <div id="modalResult" style="margin-top: 10px; font-size: 12px;"></div>
                `;
            } else {
                body.innerHTML = `<p style="font-size: 12px; color: #94a3b8;">${name} টুলটি প্রস্তুত করা হচ্ছে...</p>`;
            }

            addHistory(`${name} অপশনে প্রবেশ করা হয়েছে।`);
        }

        // প্রোফাইল চেক এক্সিকিউট
        async function runProfileCheck() {
            const uid = document.getElementById("modalUid").value.trim();
            const resBox = document.getElementById("modalResult");
            if(!uid) { alert("UID দিন!"); return; }
            resBox.innerHTML = "⏳ ফেচ করা হচ্ছে...";
            try {
                const resp = await fetch(`http://127.0.0.1:5004/info?uid=${uid}`);
                const data = await resp.json();
                if(resp.ok && data.status === "success") {
                    resBox.innerHTML = `✅ নাম: ${data.BasicInformation.Name} | লেভেল: ${data.BasicInformation.Level} | লাইক: ${data.BasicInformation.Likes}`;
                    addHistory(`UID ${uid} এর প্রোফাইল চেক সফল।`);
                } else {
                    resBox.innerHTML = `❌ এরর: খেলোয়াড় পাওয়া যায়নি!`;
                }
            } catch(e) {
                resBox.innerHTML = `❌ সার্ভার কানেকশন এরর (Python Backend চালু আছে তো?)`;
            }
        }

        function runLikesBoost() {
            const uid = document.getElementById("modalUid").value.trim();
            if(!uid) { alert("UID দিন!"); return; }
            document.getElementById("modalResult").innerHTML = `✅ UID: ${uid} এর জন্য ২২০ লাইকের রিকোয়েস্ট সাবমিট হয়েছে!`;
            addHistory(`UID ${uid} এর জন্য লাইক রিকোয়েস্ট পাঠানো হয়েছে।`);
        }

        // অ্যাডমিন প্যানেল টগল
        function toggleAdminPanel() {
            const panel = document.getElementById("adminPanel");
            panel.style.display = panel.style.display === "block" ? "none" : "block";
        }

        function loadToolStatus() {
            const tool = document.getElementById("adminToolSelect").value;
            const isMaint = localStorage.getItem("maintenance_" + tool) === "true";
            document.getElementById("adminStatusSelect").value = isMaint ? "true" : "false";
        }

        function saveAdminSettings() {
            const tool = document.getElementById("adminToolSelect").value;
            const status = document.getElementById("adminStatusSelect").value;
            localStorage.setItem("maintenance_" + tool, status);
            alert("সফলভাবে স্ট্যাটাস আপডেট করা হয়েছে!");
            toggleAdminPanel();
        }

        // নতুন বাটন বা টুল যুক্ত করা
        function addNewToolButton() {
            let key = document.getElementById("newBtnKey").value.trim();
            let name = document.getElementById("newBtnName").value.trim();
            let thumb = document.getElementById("newBtnThumb").value.trim() || "⭐";

            if(!key || !name) {
                alert("দয়া করে বাটনের কি (Key) এবং নাম দিন!");
                return;
            }

            let tools = getToolsList();
            tools.push({ key: key, name: name, thumb: thumb });
            localStorage.setItem("custom_tools_list", JSON.stringify(tools));
            renderGrid();
            alert("নতুন বাটন সফলভাবে যুক্ত করা হয়েছে!");
            document.getElementById("newBtnKey").value = "";
            document.getElementById("newBtnName").value = "";
            document.getElementById("newBtnThumb").value = "";
            toggleAdminPanel();
        }

        window.addEventListener("DOMContentLoaded", () => {
            renderGrid();
            renderHistory();
        });
    </script>
</body>
</html>
